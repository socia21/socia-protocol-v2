<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOCIA Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="/socia-favicon-32.png">
<style>
  :root {
    --navy-darkest: #020712;
    --navy-main: #0B192C;
    --navy-surface: #132743;
    --navy-light: #1A365D;
    --navy-border: #2A4365;
    --white: #FFFFFF;
    --text-muted: #94A3B8;
    --accent-gold: #D4AF37;
    --trust-green: #10B981;
    --warning-amber: #F59E0B;
    --danger-red: #EF4444;
    --action-blue: #3B82F6;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, Arial, sans-serif; background: radial-gradient(circle at 50% 0%, var(--navy-surface) 0%, var(--navy-darkest) 65%); color: var(--white); margin: 0; padding: 2rem; min-height: 100vh; }
  h1, h3 { font-family: 'Cinzel', serif; letter-spacing: 0.3px; }
  h1 { font-size: 1.4rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; }
  h1 img { height: 34px; width: auto; display: block; }

  /* Ambient background, matching the gateway page's visual language */
  .admin-bg-fx { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .admin-bg-fx::before {
    content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(212,175,55,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(212,175,55,0.045) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(circle at 50% 20%, #000 0%, transparent 70%);
    -webkit-mask-image: radial-gradient(circle at 50% 20%, #000 0%, transparent 70%);
  }
  .admin-orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; }
  .admin-orb-gold { width: 460px; height: 460px; top: -180px; right: 4%; background: radial-gradient(circle, rgba(212,175,55,0.3) 0%, transparent 70%); }
  .admin-orb-blue { width: 420px; height: 420px; bottom: -160px; left: 4%; background: radial-gradient(circle, rgba(59,130,246,0.18) 0%, transparent 70%); }

  .login-box {
    max-width: 420px; margin: 6rem auto; position: relative;
    background: linear-gradient(180deg, rgba(26,54,93,0.55) 0%, rgba(19,39,67,0.7) 100%);
    border: 1px solid var(--navy-border); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding: 2.5rem; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
    animation: adminRise 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }
  .login-box::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; border-radius: 14px 14px 0 0; background: linear-gradient(90deg, transparent, var(--accent-gold), transparent); opacity: 0.8; }
  .login-box h1 { justify-content: center; font-size: 1.15rem; margin-bottom: 1.75rem; }
  .login-eyebrow { display: block; text-align: center; font-size: 0.62rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-gold); margin-bottom: 1.5rem; }
  @keyframes adminRise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  input, select { width: 100%; padding: 0.7rem 0.85rem; margin: 0.5rem 0 1rem 0; border-radius: 8px; border: 1px solid var(--navy-border); background: rgba(2,7,18,0.4); color: var(--white); box-sizing: border-box; font-family: inherit; transition: all 0.2s ease; }
  input::placeholder { color: rgba(148,163,184,0.5); }
  input:focus, select:focus { outline: none; border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(212,175,55,0.15); }
  button { padding: 0.75rem 1.2rem; background: linear-gradient(135deg, #D4AF37 0%, #AA820A 100%); color: var(--navy-darkest); border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all 0.2s ease; width: 100%; }
  button:hover { filter: brightness(1.1); box-shadow: 0 4px 16px rgba(212,175,55,0.3); transform: translateY(-1px); }
  button.small { padding: 0.4rem 0.8rem; font-size: 0.75rem; width: auto; }

  .tabs { display: flex; gap: 0.4rem; margin-bottom: 1.5rem; flex-wrap: wrap; background: rgba(2,7,18,0.35); border: 1px solid var(--navy-border); border-radius: 10px; padding: 0.4rem; }
  .tab { cursor: pointer; padding: 0.55rem 1rem; border-radius: 7px; background: transparent; font-size: 0.78rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s ease; display: flex; align-items: center; gap: 0.4rem; }
  .tab:hover:not(.active) { color: var(--white); background: rgba(255,255,255,0.04); }
  .tab.active { background: linear-gradient(135deg, rgba(212,175,55,0.18), rgba(212,175,55,0.06)); color: var(--accent-gold); box-shadow: inset 0 0 0 1px rgba(212,175,55,0.4); }
  .tab svg { width: 14px; height: 14px; flex-shrink: 0; }

  .card { background: rgba(19,39,67,0.55); border: 1px solid var(--navy-border); backdrop-filter: blur(8px); padding: 1.1rem 1.3rem; border-radius: 10px; margin-bottom: 0.75rem; }
  .card h3 { margin: 0 0 0.4rem 0; font-size: 0.95rem; color: var(--white); }
  .meta { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem; }
  .status { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .status-Open { background: rgba(245,158,11,0.15); color: var(--warning-amber); border: 1px solid rgba(245,158,11,0.35); }
  .status-Resolved { background: rgba(16,185,129,0.15); color: var(--trust-green); border: 1px solid rgba(16,185,129,0.35); }
  .status-InProgress { background: rgba(59,130,246,0.15); color: var(--action-blue); border: 1px solid rgba(59,130,246,0.35); }
  #app { display: none; max-width: 1440px; margin: 0 auto; }
  .hidden { display: none; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.85rem; margin-bottom: 1.75rem; }
  .stat-box { background: rgba(19,39,67,0.55); border: 1px solid var(--navy-border); padding: 1.1rem; border-radius: 10px; text-align: center; transition: all 0.2s ease; }
  .stat-box:hover { border-color: rgba(212,175,55,0.4); transform: translateY(-2px); }
  .stat-box .num { font-size: 1.6rem; font-weight: 800; color: var(--accent-gold); font-family: 'Cinzel', serif; }
  .stat-box .label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 0.3rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
  th { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--navy-border); color: var(--accent-gold); text-transform: uppercase; font-size: 0.65rem; letter-spacing: 0.5px; }
  td { padding: 0.6rem 0.5rem; border-bottom: 1px solid rgba(42,67,101,0.4); }
  tr:hover td { background: rgba(212,175,55,0.03); }
  .badge-yes { color: var(--trust-green); font-weight: 700; }
  .badge-no { color: #64748b; }
  .table-wrap { overflow-x: auto; }
  .search-box { margin-bottom: 0.75rem; }
  .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0.85rem; }
  .bar-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.4rem 0; font-size: 0.75rem; }
  .bar-label { width: 40%; flex-shrink: 0; color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; background: rgba(2,7,18,0.5); border-radius: 4px; height: 14px; overflow: hidden; border: 1px solid var(--navy-border); }
  .bar-fill { background: linear-gradient(90deg, #AA820A, var(--accent-gold)); height: 100%; border-radius: 4px; min-width: 2px; }
  .bar-count { width: 2.5rem; text-align: right; color: var(--text-muted); flex-shrink: 0; }
  .trend-chart { display: flex; align-items: flex-end; gap: 2px; height: 70px; margin-top: 0.5rem; }
  .trend-bar { flex: 1; background: linear-gradient(180deg, var(--accent-gold), #AA820A); border-radius: 2px 2px 0 0; min-height: 1px; }
  .trend-chart-labels { display: flex; justify-content: space-between; font-size: 0.6rem; color: #64748b; margin-top: 0.25rem; }
  .funnel-row { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 0.4rem 0; border-bottom: 1px solid rgba(42,67,101,0.4); }
  .funnel-row .val { font-weight: 700; color: var(--accent-gold); }
  .lockout-notice { display: flex; align-items: center; gap: 0.5rem; font-size: 0.7rem; color: var(--danger-red); background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); padding: 0.5rem 0.75rem; border-radius: 8px; margin-top: 0.75rem; }
</style>
</head>
<body>

  <div class="admin-bg-fx">
    <div class="admin-orb admin-orb-gold"></div>
    <div class="admin-orb admin-orb-blue"></div>
  </div>

  <div class="login-box" id="login-box">
    <span class="login-eyebrow">Restricted Access</span>
    <h1><img src="/socia-logo-light.png" alt="SOCIA"> Admin Access</h1>
    <div id="login-step-secret">
      <label style="font-size:0.8rem;">Admin Secret</label>
      <input type="password" id="admin-secret-input" placeholder="Enter ADMIN_SECRET">
      <button onclick="requestAdmin2FA()">Continue</button>
    </div>
    <div id="login-step-otp" class="hidden">
      <label style="font-size:0.8rem;">2FA Code (sent to admin email)</label>
      <input type="text" id="admin-otp-input" placeholder="123456" maxlength="6">
      <button onclick="verifyAdmin2FA()">Verify & Enter</button>
      <p style="font-size:0.65rem; color:var(--text-muted); text-align:center; margin-top:0.75rem;">3 incorrect codes locks admin access for 30 minutes.</p>
    </div>
    <p id="login-error" style="color:#f87171; font-size:0.8rem; margin-top:1rem; text-align:center;"></p>
  </div>

  <div id="app">
    <h1><img src="/socia-logo-light.png" alt="SOCIA"> Admin Dashboard</h1>

    <div class="stat-grid" id="overview-stats"></div>

    <div class="tabs">
      <div class="tab" id="tab-analytics" onclick="switchAdminTab('analytics')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg> Analytics</div>
      <div class="tab active" id="tab-tickets" onclick="switchAdminTab('tickets')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg> Support Tickets</div>
      <div class="tab" id="tab-users" onclick="switchAdminTab('users')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg> Users</div>
      <div class="tab" id="tab-escrow" onclick="switchAdminTab('escrow')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Escrow Reviews</div>
      <div class="tab" id="tab-disputes" onclick="switchAdminTab('disputes')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg> Disputes</div>
      <div class="tab" id="tab-algorithm" onclick="switchAdminTab('algorithm')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 10v6M4.22 4.22l4.24 4.24m7.08 7.08l4.24 4.24M1 12h6m10 0h6M4.22 19.78l4.24-4.24m7.08-7.08l4.24-4.24"/></svg> Algorithm Data</div>
      <div class="tab" id="tab-audit" onclick="switchAdminTab('audit')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg> Audit Log</div>
    </div>

    <div id="panel-analytics" class="hidden"></div>
    <div id="panel-tickets"></div>
    <div id="panel-users" class="hidden"></div>
    <div id="panel-escrow" class="hidden"></div>
    <div id="panel-disputes" class="hidden"></div>
    <div id="panel-algorithm" class="hidden"></div>
    <div id="panel-audit" class="hidden"></div>
  </div>

<script>
  let ADMIN_SESSION = localStorage.getItem('socia_admin_session') || '';
  let ALL_USERS = [];

  async function requestAdmin2FA() {
    const val = document.getElementById('admin-secret-input').value.trim();
    if (!val) return;
    document.getElementById('login-error').innerText = '';
    try {
      const res = await fetch('/api/admin/request-2fa', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret: val })
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('login-error').innerText = data.detail || 'Invalid secret.';
        return;
      }
      document.getElementById('login-step-secret').classList.add('hidden');
      document.getElementById('login-step-otp').classList.remove('hidden');
    } catch (err) {
      document.getElementById('login-error').innerText = 'Request failed.';
    }
  }

  async function verifyAdmin2FA() {
    const otp = document.getElementById('admin-otp-input').value.trim();
    if (!otp) return;
    try {
      const res = await fetch('/api/admin/verify-2fa', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ otp_code: otp })
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('login-error').innerText = data.detail || 'Invalid code.';
        return;
      }
      ADMIN_SESSION = data.session_token;
      localStorage.setItem('socia_admin_session', ADMIN_SESSION);
      enterDashboard();
    } catch (err) {
      document.getElementById('login-error').innerText = 'Request failed.';
    }
  }

  async function adminFetch(url, options = {}) {
    const headers = { ...(options.headers || {}), 'X-Admin-Session': ADMIN_SESSION };
    const res = await fetch(url, { ...options, headers });
    if (res.status === 401) {
      localStorage.removeItem('socia_admin_session');
      document.getElementById('app').style.display = 'none';
      document.getElementById('login-box').style.display = 'block';
      document.getElementById('login-step-secret').classList.remove('hidden');
      document.getElementById('login-step-otp').classList.add('hidden');
      document.getElementById('login-error').innerText = 'Session expired. Please log in again.';
      throw new Error('Session expired');
    }
    return res;
  }

  async function enterDashboard() {
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadOverview();
    loadTickets();
  }

  if (ADMIN_SESSION) {
    adminFetch('/api/admin/overview').then(res => {
      if (res.ok) enterDashboard();
    }).catch(() => {});
  }

  async function loadOverview() {
    try {
      const res = await adminFetch('/api/admin/overview');
      const s = await res.json();
      document.getElementById('overview-stats').innerHTML = `
        <div class="stat-box"><div class="num">${s.total_users}</div><div class="label">Total Users</div></div>
        <div class="stat-box"><div class="num">${s.sponsors} / ${s.influencers}</div><div class="label">Sponsors / Influencers</div></div>
        <div class="stat-box"><div class="num">${s.active_subscribers}</div><div class="label">Sovereign Subscribers</div></div>
        <div class="stat-box"><div class="num">${s.total_listings}</div><div class="label">Listings</div></div>
        <div class="stat-box"><div class="num">${s.pending_pitches}</div><div class="label">Pending Pitches</div></div>
        <div class="stat-box"><div class="num">${s.total_negotiations}</div><div class="label">Negotiations</div></div>
        <div class="stat-box"><div class="num">₹${s.total_gmv_released.toLocaleString()}</div><div class="label">GMV Released</div></div>
        <div class="stat-box"><div class="num">₹${s.total_commission_earned.toLocaleString()}</div><div class="label">Commission Earned</div></div>
        <div class="stat-box"><div class="num">${s.open_tickets}</div><div class="label">Open Tickets</div></div>
      `;
    } catch (err) { }
  }

  function switchAdminTab(tab) {
    ['analytics','tickets','users','escrow','disputes','algorithm','audit'].forEach(t => {
      document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
      document.getElementById(`panel-${t}`).classList.toggle('hidden', t !== tab);
    });
    if (tab === 'analytics') loadAnalytics();
    if (tab === 'audit') loadAuditLog();
    if (tab === 'escrow') loadEscrowReviews();
    if (tab === 'disputes') loadDisputes();
    if (tab === 'algorithm') loadAlgorithmData();
    if (tab === 'users') loadUsers();
  }

  function barList(items, maxCount) {
    if (!items || items.length === 0) return '<p style="color:#64748b; font-size:0.75rem;">No data yet.</p>';
    const max = maxCount || Math.max(...items.map(i => i.count), 1);
    return items.map(i => `
      <div class="bar-row">
        <div class="bar-label" title="${escapeHtml(i.label)}">${escapeHtml(i.label)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max((i.count / max) * 100, 2)}%"></div></div>
        <div class="bar-count">${i.count}</div>
      </div>
    `).join('');
  }

  function trendChart(points) {
    if (!points || points.length === 0) return '<p style="color:#64748b; font-size:0.75rem;">No data yet.</p>';
    const max = Math.max(...points.map(p => p.count), 1);
    const bars = points.map(p => `<div class="trend-bar" style="height:${Math.max((p.count / max) * 100, 2)}%" title="${p.date}: ${p.count}"></div>`).join('');
    return `
      <div class="trend-chart">${bars}</div>
      <div class="trend-chart-labels"><span>${points[0].date}</span><span>${points[points.length - 1].date}</span></div>
    `;
  }

  async function loadAnalytics() {
    const panel = document.getElementById('panel-analytics');
    panel.innerHTML = '<p>Crunching platform data...</p>';
    try {
      const res = await adminFetch('/api/admin/analytics');
      const a = await res.json();

      panel.innerHTML = `
        <div class="analytics-grid">
          <div class="card">
            <h3>Signups — Last 30 Days</h3>
            ${trendChart(a.trends.signups_last_30_days)}
          </div>
          <div class="card">
            <h3>New Listings — Last 30 Days</h3>
            ${trendChart(a.trends.listings_last_30_days)}
          </div>

          <div class="card">
            <h3>Pitch Funnel</h3>
            <div class="funnel-row"><span>Total pitches sent</span><span class="val">${a.funnels.pitches.total}</span></div>
            <div class="funnel-row"><span>Accepted</span><span class="val">${a.funnels.pitches.accepted}</span></div>
            <div class="funnel-row"><span>Rejected</span><span class="val">${a.funnels.pitches.rejected}</span></div>
            <div class="funnel-row"><span>Pending</span><span class="val">${a.funnels.pitches.pending}</span></div>
            <div class="funnel-row"><span>Acceptance rate</span><span class="val">${a.funnels.pitches.acceptance_rate_pct}%</span></div>
          </div>
          <div class="card">
            <h3>Deal / Escrow Funnel</h3>
            <div class="funnel-row"><span>Negotiations opened</span><span class="val">${a.funnels.negotiations_opened}</span></div>
            ${Object.entries(a.funnels.escrow_by_status).map(([k,v]) => `<div class="funnel-row"><span>Escrow: ${escapeHtml(k)}</span><span class="val">${v}</span></div>`).join('')}
            <div class="funnel-row"><span>Total GMV released</span><span class="val">₹${a.funnels.total_gmv_released.toLocaleString()}</span></div>
            <div class="funnel-row"><span>Commission earned</span><span class="val">₹${a.funnels.total_commission_earned.toLocaleString()}</span></div>
            <div class="funnel-row"><span>Avg deal size</span><span class="val">₹${a.funnels.avg_deal_size.toLocaleString()}</span></div>
          </div>

          <div class="card">
            <h3>Industry Breakdown</h3>
            ${barList(a.breakdowns.industry)}
          </div>
          <div class="card">
            <h3>Niche Tags</h3>
            ${barList(a.breakdowns.niche_tags)}
          </div>
          <div class="card">
            <h3>Platforms</h3>
            ${barList(a.breakdowns.platforms)}
          </div>
          <div class="card">
            <h3>Top Locations</h3>
            ${barList(a.breakdowns.location)}
          </div>
          <div class="card">
            <h3>Content Languages</h3>
            ${barList(a.breakdowns.content_languages)}
          </div>
          <div class="card">
            <h3>Budget Distribution</h3>
            ${barList(a.breakdowns.budget_distribution)}
          </div>
          <div class="card">
            <h3>Reliability / Trust Distribution</h3>
            ${barList(a.breakdowns.reliability)}
          </div>

          <div class="card">
            <h3>Supply & Demand</h3>
            <div class="funnel-row"><span>Sponsor listings</span><span class="val">${a.supply_demand.sponsor_listings}</span></div>
            <div class="funnel-row"><span>Influencer listings</span><span class="val">${a.supply_demand.influencer_listings}</span></div>
            <div class="funnel-row"><span>Verified listings</span><span class="val">${a.supply_demand.verified_listings}</span></div>
            <div class="funnel-row"><span>Unverified listings</span><span class="val">${a.supply_demand.unverified_listings}</span></div>
            <div class="funnel-row"><span>Brand-safety conscious sponsors</span><span class="val">${a.supply_demand.brand_safety_conscious_sponsors}</span></div>
            <div class="funnel-row"><span>Local-presence campaigns</span><span class="val">${a.supply_demand.local_presence_required_campaigns}</span></div>
          </div>
          <div class="card">
            <h3>Users & Support</h3>
            <div class="funnel-row"><span>Total users</span><span class="val">${a.users.total}</span></div>
            <div class="funnel-row"><span>Verified users</span><span class="val">${a.users.verified}</span></div>
            <div class="funnel-row"><span>Subscribed</span><span class="val">${a.users.subscribed}</span></div>
            <div class="funnel-row"><span>Subscription conversion</span><span class="val">${a.users.subscription_conversion_rate_pct}%</span></div>
            <div class="funnel-row"><span>Open tickets</span><span class="val">${a.support.open}</span></div>
            <div class="funnel-row"><span>In progress</span><span class="val">${a.support.in_progress}</span></div>
            <div class="funnel-row"><span>Resolved</span><span class="val">${a.support.resolved}</span></div>
          </div>
        </div>
        <p style="color:#64748b; font-size:0.68rem; margin-top:1rem;">Generated ${new Date(a.generated_at).toLocaleString()}</p>
      `;
    } catch (err) {
      panel.innerHTML = '<p style="color:#f87171;">Could not load analytics.</p>';
    }
  }

  async function loadUsers() {
    const panel = document.getElementById('panel-users');
    panel.innerHTML = '<p>Loading...</p>';
    try {
      const res = await adminFetch('/api/admin/users');
      ALL_USERS = await res.json();
      renderUsersTable(ALL_USERS);
    } catch (err) {
      panel.innerHTML = '<p style="color:#f87171;">Could not load users.</p>';
    }
  }

  function filterUsers() {
    const q = document.getElementById('user-search').value.trim().toLowerCase();
    if (!q) { renderUsersTable(ALL_USERS); return; }
    const filtered = ALL_USERS.filter(u =>
      u.email.toLowerCase().includes(q) ||
      (u.display_name || '').toLowerCase().includes(q) ||
      (u.role || '').toLowerCase().includes(q) ||
      (u.industry || '').toLowerCase().includes(q)
    );
    renderUsersTable(filtered);
  }

  function renderUsersTable(users) {
    const panel = document.getElementById('panel-users');
    panel.innerHTML = `
      <div class="card">
        <input type="text" id="user-search" class="search-box" placeholder="Search by email, name, role, industry..." oninput="filterUsers()" style="margin:0;">
        <div class="table-wrap">
        <table>
          <tr>
            <th>Email</th><th>Name</th><th>Role</th><th>Phone</th><th>Industry</th>
            <th>Verified</th><th>Subscribed</th><th>Payout Linked</th><th>Registered</th>
          </tr>
          ${users.map(u => `
            <tr>
              <td>${escapeHtml(u.email)}</td>
              <td>${escapeHtml(u.display_name)}</td>
              <td>${escapeHtml(u.role)}</td>
              <td>${escapeHtml(u.phone_number || '—')}</td>
              <td>${escapeHtml(u.industry || '—')}</td>
              <td class="${u.is_verified ? 'badge-yes' : 'badge-no'}">${u.is_verified ? '✓' : '✕'}</td>
              <td class="${u.is_subscribed ? 'badge-yes' : 'badge-no'}">${u.is_subscribed ? '✓' : '✕'}</td>
              <td class="${u.razorpay_account_active ? 'badge-yes' : 'badge-no'}">${u.razorpay_account_active ? '✓' : (u.razorpay_account_id ? 'Pending' : '✕')}</td>
              <td>${u.created_at ? new Date(u.created_at).toLocaleDateString() : '—'}</td>
            </tr>
          `).join('')}
        </table>
        </div>
      </div>
    `;
  }

  async function loadEscrowReviews() {
    const panel = document.getElementById('panel-escrow');
    panel.innerHTML = '<p>Loading...</p>';
    try {
      const res = await adminFetch('/api/admin/escrow/pending-review');
      const payments = await res.json();
      if (payments.length === 0) {
        panel.innerHTML = '<p style="color:#94a3b8;">No escrow releases currently awaiting review.</p>';
        return;
      }
      panel.innerHTML = payments.map(p => `
        <div class="card">
          <h3>Negotiation #${p.negotiation_id} — ₹${p.influencer_payout.toLocaleString()} to influencer</h3>
          <div class="meta">Sponsor: ${escapeHtml(p.sponsor_email)} — Influencer: ${escapeHtml(p.influencer_email)}</div>
          <div class="meta">Total: ₹${p.amount.toLocaleString()} | Platform fee: ₹${p.platform_fee.toLocaleString()}</div>
          <button class="small" onclick="approveEscrowRelease(${p.id})">Approve Release</button>
        </div>
      `).join('');
    } catch (err) {
      panel.innerHTML = '<p style="color:#f87171;">Could not load pending escrow reviews.</p>';
    }
  }

  async function approveEscrowRelease(paymentId) {
    if (!confirm('Approve this escrow release? This will transfer real funds immediately.')) return;
    try {
      const res = await adminFetch(`/api/admin/escrow/${paymentId}/approve`, { method: 'POST' });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.detail || 'Could not approve release.');
        return;
      }
      alert('Escrow released.');
      loadEscrowReviews();
      loadOverview();
    } catch (err) {
      alert('Could not approve release: request failed.');
    }
  }

  async function loadDisputes() {
    const panel = document.getElementById('panel-disputes');
    panel.innerHTML = '<p>Loading...</p>';
    try {
      const res = await adminFetch('/api/admin/disputes');
      const disputes = await res.json();
      if (disputes.length === 0) {
        panel.innerHTML = '<p style="color:#94a3b8;">No open disputes.</p>';
        return;
      }
      panel.innerHTML = disputes.map(d => {
        const c = d.compliance;
        const reqRows = (c.items || []).map(it => `
          <div class="meta" style="margin-left:1rem;">
            ${it.met ? '✓' : '✗'} ${escapeHtml(it.label)} ${it.required ? '(required)' : '(optional)'} ${it.reason_code ? '— ' + escapeHtml(it.reason_code) : '— unreviewed'}
          </div>
        `).join('');
        return `
          <div class="card">
            <h3>Dispute #${d.dispute.id} — Negotiation #${d.negotiation.id}</h3>
            <div class="meta">Raised by ${escapeHtml(d.dispute.raised_by_role)} (${escapeHtml(d.dispute.raised_by_email)}) on ${new Date(d.dispute.created_at).toLocaleString()}</div>
            <p>"${escapeHtml(d.dispute.reason)}"</p>
            <div class="meta">Sponsor: ${escapeHtml(d.negotiation.sponsor_email)} — Influencer: ${escapeHtml(d.negotiation.influencer_email)}</div>
            ${d.payment ? `<div class="meta">Escrow: ₹${d.payment.amount.toLocaleString()} total, ₹${d.payment.influencer_payout.toLocaleString()} payout, status: ${escapeHtml(d.payment.status)}</div>` : ''}
            <div class="meta">Objective compliance: ${c.compliance_percent}% (${c.required_met}/${c.required_total} required met)${reqRows ? ':' : ' — no requirements defined on this deal.'}</div>
            ${reqRows}
            <div style="margin-top:0.75rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
              <button class="small" onclick="resolveDispute(${d.dispute.id}, 'release')">Resolve: Release to Influencer</button>
              <button class="small" onclick="resolveDispute(${d.dispute.id}, 'refund')">Resolve: Refund Sponsor</button>
              <button class="small" onclick="resolveDispute(${d.dispute.id}, 'partial')">Resolve: Partial (manual split)</button>
            </div>
          </div>
        `;
      }).join('');
    } catch (err) {
      panel.innerHTML = '<p style="color:#f87171;">Could not load disputes.</p>';
    }
  }

  async function resolveDispute(disputeId, resolution) {
    const verb = resolution === 'release' ? 'release the full escrow to the influencer' : resolution === 'refund' ? 'fully refund the sponsor' : 'record a partial settlement (no funds move automatically)';
    if (!confirm(`Resolve this dispute — ${verb}? This is final.`)) return;
    const resolution_note = resolution === 'partial' ? (prompt('Describe the intended split (for the manual Razorpay settlement):') || '') : '';
    if (resolution === 'partial' && !resolution_note.trim()) return;
    try {
      const res = await adminFetch(`/api/admin/disputes/${disputeId}/resolve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ resolution, resolution_note })
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.detail || 'Could not resolve dispute.');
        return;
      }
      alert(data.message || 'Dispute resolved.');
      loadDisputes();
      loadOverview();
    } catch (err) {
      alert('Could not resolve dispute: request failed.');
    }
  }

  async function loadTickets() {
    const panel = document.getElementById('panel-tickets');
    panel.innerHTML = '<p>Loading...</p>';
    try {
      const res = await adminFetch('/api/admin/tickets');
      const tickets = await res.json();
      if (tickets.length === 0) {
        panel.innerHTML = '<p style="color:#94a3b8;">No support tickets yet.</p>';
        return;
      }
      panel.innerHTML = tickets.map(t => `
        <div class="card">
          <h3>${escapeHtml(t.subject)} <span class="status status-${t.status.replace(' ', '')}">${escapeHtml(t.status)}</span></h3>
          <div class="meta">From: ${escapeHtml(t.email)} (${escapeHtml(t.name)}) — ${new Date(t.created_at).toLocaleString()}</div>
          <p>${escapeHtml(t.message)}</p>
          <select onchange="updateTicketStatus(${t.id}, this.value)">
            <option value="Open" ${t.status === 'Open' ? 'selected' : ''}>Open</option>
            <option value="In Progress" ${t.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
            <option value="Resolved" ${t.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
          </select>
        </div>
      `).join('');
    } catch (err) {
      panel.innerHTML = '<p style="color:#f87171;">Could not load tickets.</p>';
    }
  }

  async function updateTicketStatus(ticketId, newStatus) {
    try {
      await adminFetch(`/api/admin/tickets/${ticketId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });
      loadTickets();
      loadOverview();
    } catch (err) {
      alert('Could not update ticket status.');
    }
  }

  async function loadAlgorithmData() {
    const panel = document.getElementById('panel-algorithm');
    panel.innerHTML = '<p>Loading...</p>';
    try {
      const statsRes = await adminFetch('/api/admin/algorithm/stats');
      const stats = await statsRes.json();
      const listingsRes = await adminFetch('/api/admin/algorithm/listings');
      const listings = await listingsRes.json();

      panel.innerHTML = `
        <div class="card">
          <h3>Data Health Overview</h3>
          <div class="meta">Total listings: ${stats.total_listings} (${stats.sponsors} sponsors, ${stats.influencers} influencers)</div>
          <div class="meta">Complete mandatory matching data: ${stats.listings_with_complete_mandatory_data} / ${stats.total_listings}</div>
          <div class="meta">Optional location filled in: ${stats.listings_with_optional_location} | Optional interests filled in: ${stats.listings_with_optional_interests}</div>
          <div class="meta">Anonymous listings: ${stats.anonymous_listings}</div>
        </div>
        <div class="card">
          <h3>Score Any Two Listings</h3>
          <input type="number" id="score-viewer-id" placeholder="Viewer listing ID" style="width:45%; display:inline-block; margin-right:0.5rem;">
          <input type="number" id="score-candidate-id" placeholder="Candidate listing ID" style="width:45%; display:inline-block;">
          <button class="small" onclick="scorePair()" style="margin-top:0.5rem;">Compute Score</button>
          <div id="score-result" style="margin-top:0.75rem; font-size:0.8rem;"></div>
        </div>
        <div class="card">
          <h3>All Listings — Raw Matching Data</h3>
          <div class="table-wrap">
          <table>
            <tr><th>ID</th><th>Name</th><th>Role</th><th>Budget</th><th>Audience</th><th>Engagement</th><th>Niches</th><th>Location</th><th>Platforms</th><th>Anon?</th></tr>
            ${listings.map(l => `
              <tr>
                <td>${l.id}</td>
                <td>${escapeHtml(l.name)}</td>
                <td>${escapeHtml(l.role)}</td>
                <td>₹${l.budget_min}-₹${l.budget_max}</td>
                <td>${l.audience_size}</td>
                <td>${l.engagement_rate}%</td>
                <td>${escapeHtml(l.niche_tags)}</td>
                <td>${escapeHtml(l.location || '—')}</td>
                <td>${escapeHtml(l.platforms || '—')}</td>
                <td>${l.is_anonymous ? 'Yes' : 'No'}</td>
              </tr>
            `).join('')}
          </table>
          </div>
        </div>
      `;
    } catch (err) {
      panel.innerHTML = '<p style="color:#f87171;">Could not load algorithm data.</p>';
    }
  }

  async function scorePair() {
    const viewerId = document.getElementById('score-viewer-id').value;
    const candidateId = document.getElementById('score-candidate-id').value;
    const resultBox = document.getElementById('score-result');
    if (!viewerId || !candidateId) { resultBox.innerText = 'Enter both listing IDs.'; return; }
    try {
      const res = await adminFetch(`/api/admin/algorithm/score-pair?viewer_listing_id=${viewerId}&candidate_listing_id=${candidateId}`);
      const data = await res.json();
      if (!res.ok) { resultBox.innerText = data.detail || 'Error computing score.'; return; }
      resultBox.innerHTML = `<strong>Computed score: ${data.computed_score}%</strong><br>Viewer: ${escapeHtml(data.viewer.name)} — Candidate: ${escapeHtml(data.candidate.name)}`;
    } catch (err) {
      resultBox.innerText = 'Request failed.';
    }
  }

  async function loadAuditLog() {
    const panel = document.getElementById('panel-audit');
    panel.innerHTML = '<p>Loading...</p>';
    try {
      const res = await adminFetch('/api/admin/audit-log');
      const logs = await res.json();
      if (logs.length === 0) {
        panel.innerHTML = '<p style="color:#94a3b8;">No audit log entries yet.</p>';
        return;
      }
      panel.innerHTML = logs.map(l => `
        <div class="card">
          <div class="meta">${new Date(l.created_at).toLocaleString()}</div>
          <strong>${escapeHtml(l.action)}</strong> — ${escapeHtml(l.email)}
          ${l.detail ? `<div class="meta">${escapeHtml(l.detail)}</div>` : ''}
        </div>
      `).join('');
    } catch (err) {
      panel.innerHTML = '<p style="color:#f87171;">Could not load audit log.</p>';
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }
</script>
</body>
</html>
